<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Document container -->
  <g filter="url(#shadow)">
    <!-- Back page -->
    <rect x="130" y="100" width="252" height="312" rx="20" fill="#14b8a6" opacity="0.4" transform="rotate(6 256 256)" />
    <!-- Front page -->
    <rect x="120" y="90" width="272" height="332" rx="24" fill="#ffffff" />
    <!-- Top badge / bookmark -->
    <path d="M 330 90 L 360 90 L 360 145 L 345 132 L 330 145 Z" fill="#0f766e" />
    <!-- Code prompt symbol: > -->
    <path d="M 165 155 L 205 185 L 165 215" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Code cursor / line -->
    <line x1="225" y1="215" x2="265" y2="215" stroke="#0f766e" stroke-width="12" stroke-linecap="round" />
    <!-- Document content lines -->
    <rect x="165" y="260" width="182" height="14" rx="7" fill="#cbd5e1" />
    <rect x="165" y="295" width="140" height="14" rx="7" fill="#cbd5e1" />
    <rect x="165" y="330" width="160" height="14" rx="7" fill="#cbd5e1" />
    <rect x="165" y="365" width="100" height="14" rx="7" fill="#94a3b8" />
  </g>
</svg>
